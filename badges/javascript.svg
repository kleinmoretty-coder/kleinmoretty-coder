<svg xmlns="http://www.w3.org/2000/svg" width="147" height="32" viewBox="0 0 184 40" role="img" aria-label="JavaScript">
  <defs>
    <clipPath id="rounded"><rect width="184" height="40" rx="5"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".19"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="184" height="40" fill="#C28B56"/>
    <rect width="44" height="40" fill="#91643C"/>
    <rect x="0" y="0" width="184" height="1" fill="#ffffff" opacity=".12"/>
    <text x="22.0" y="25.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">JS</text>
    <text x="56" y="25.4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">JavaScript</text>
    <rect x="-184" width="92" height="40" fill="url(#shine)">
      <animate attributeName="x" values="-184;184" dur="5s" repeatCount="indefinite" keyTimes="0;1"/>
    </rect>
  </g>
</svg>
